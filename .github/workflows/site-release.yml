name: Release Site

# on:
#   push:
#     branches: [ "master" ]
#   pull_request:
#     branches: [ "master" ]

on:
  pull_request:
    branches:
      - master
    types:
      - closed

jobs:
  determine-release-type:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      release-type: ${{ steps.detect-type.outputs.type }}
      next-version: ${{ steps.detect-type.outputs.version }}
      tag-name: ${{ steps.detect-type.outputs.tag }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Detect release type from labels
        id: detect-type
        run: |
          echo "🏷️  Determining release type from PR labels..."

          # Detect from labels
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

          # Get last version from CHANGELOG
          LAST_VERSION=$(grep -m 1 "^## \[" CHANGELOG.txt | sed 's/^## \[\([^]]*\)\].*/\1/')
          echo "📌 Last version: $LAST_VERSION"

          # Parse current version
          CURRENT_MAJOR=$(echo "$LAST_VERSION" | cut -d. -f1)
          CURRENT_MINOR=$(echo "$LAST_VERSION" | cut -d. -f2)
          CURRENT_PATCH=$(echo "$LAST_VERSION" | cut -d. -f3)

          # Calculate next version based on type
          TYPE="${{ steps.detect-type.outputs.type }}"
          case "$TYPE" in
            major)
              NEXT_MAJOR=$((CURRENT_MAJOR + 1))
              NEXT_VERSION="${NEXT_MAJOR}.0.0"
              ;;
            minor)
              NEXT_MINOR=$((CURRENT_MINOR + 1))
              NEXT_VERSION="${CURRENT_MAJOR}.${NEXT_MINOR}.0"
              ;;
            patch)
              NEXT_PATCH=$((CURRENT_PATCH + 1))
              NEXT_VERSION="${CURRENT_MAJOR}.${CURRENT_MINOR}.${NEXT_PATCH}"
              ;;
          esac

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEXT_VERSION" >> $GITHUB_OUTPUT

          echo "📌 Release type: $TYPE"
          echo "📌 Next version: $NEXT_VERSION"
          echo "🏷️  Tag: v$NEXT_VERSION"

  release:
    if: github.event.pull_request.merged == true
    needs: determine-release-type
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release info
        run: |
          echo "📦 Release Information:"
          echo "   Type: ${{ needs.determine-release-type.outputs.release-type }}"
          echo "   Version: ${{ needs.determine-release-type.outputs.next-version }}"
          echo "   Tag: ${{ needs.determine-release-type.outputs.tag-name }}"

      - name: Validate CHANGELOG
        run: |
          chmod +x ./scripts/validate-changelog.sh
          ./scripts/validate-changelog.sh
        env:
          RELEASE_TYPE: ${{ needs.determine-release-type.outputs.release-type }}

      - name: Bump version in CHANGELOG
        run: |
          chmod +x ./scripts/bump-version.sh
          ./scripts/bump-version.sh ${{ needs.determine-release-type.outputs.release-type }}
        env:
          CHANGELOG_FILE: "CHANGELOG.txt"

      - name: Commit version bump
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.txt
          git commit -m "chore: bump version to ${{ needs.determine-release-type.outputs.next-version }}"
          git push

      - name: Build the site in the jekyll/builder container
        run: |
          docker run \
          -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
          jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"

      - name: Run accessibility audit
        run: |
          # Build a11y Docker image
          docker build -t bitprepared-a11y:latest -f docker/accessibility/Dockerfile .
          # Start Jekyll in background
          docker run -d \
            --name bitprepared-jekyll \
            -v ${{ github.workspace }}:/srv/jekyll \
            -p 4000:4000 \
            jekyll/jekyll:latest \
            jekyll serve --config _config.yml,_config_dev.yml --host 0.0.0.0
          # Wait for Jekyll to be ready
          for i in {1..30}; do
            if curl -f -s -o /dev/null http://localhost:4000; then
              echo "Jekyll ready"
              break
            fi
            sleep 1
          done
          # Run accessibility audit
          mkdir -p docs/accessibility/reports
          docker run --rm --init \
            -v ${{ github.workspace }}/docs/accessibility/reports:/app/reports \
            --add-host=host.docker.internal:host-gateway \
            -e SITE_URL=http://host.docker.internal:4000 \
            bitprepared-a11y:latest \
            bash /app/scripts/accessibility-full-audit.sh
          # Stop Jekyll
          docker stop bitprepared-jekyll || true
          docker rm bitprepared-jekyll || true

      - name: Generate accessibility summary
        run: |
          ./scripts/analyze-a11y-reports.sh docs/accessibility/reports > docs/accessibility/reports/summary.md

      - uses: montudor/action-zip@v1
        with:
          args: zip -qq -r release.zip _site

      - name: Create Git Tag
        run: |
          git tag -a ${{ needs.determine-release-type.outputs.tag-name }} -m "Release ${{ needs.determine-release-type.outputs.tag-name }}"
          git push origin ${{ needs.determine-release-type.outputs.tag-name }}

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "release.zip"
          removeArtifacts: true
          makeLatest: true
          tag: ${{ needs.determine-release-type.outputs.tag-name }}
          bodyFile: "CHANGELOG.txt"
          generateReleaseNotes: false

      - name: Upload accessibility summary as artifact
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-report
          path: docs/accessibility/reports/summary.md

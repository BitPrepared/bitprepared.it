name: Validate PR

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled]

jobs:
  validate-changelog:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release type from labels
        id: release-type
        run: |
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:patch') }}" == "true" ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Show detected release type
        run: |
          echo "🏷️  Release type detected: ${{ steps.release-type.outputs.type }}"

      - name: Validate CHANGELOG
        id: validate
        run: |
          chmod +x ./scripts/validate-changelog.sh
          ./scripts/validate-changelog.sh
        env:
          RELEASE_TYPE: ${{ steps.release-type.outputs.type }}

      - name: Show next version
        run: |
          echo "📌 Next version will be: v${{ env.NEXT_VERSION }}"

      - name: Comment on PR if validation fails
        if: failure() && steps.validate.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **CHANGELOG Validation Failed**\n\n' +
                    'Please ensure CHANGELOG.txt is updated:\n' +
                    '- Add an **[Unreleased]** section at the end with your changes\n' +
                    '- Follow the format: `## [Unreleased]`\n\n' +
                    'For more details, see the workflow logs.'
            })

      - name: Check validation result
        if: always()
        run: |
          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            echo "✅ CHANGELOG validation passed"
          else
            echo "❌ CHANGELOG validation failed"
            exit 1
          fi

  check-html-in-markdown:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for HTML in markdown files
        id: check-html
        run: |
          chmod +x ./scripts/check-html-in-markdown.sh
          ./scripts/check-html-in-markdown.sh

      - name: Comment on PR if HTML found
        if: failure() && steps.check-html.outcome == 'failure'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **HTML Found in Markdown Files**\n\n' +
                    'Jekyll usa Liquid templates, non HTML inline nei file markdown.\n\n' +
                    '**Problemi trovati:**\n' +
                    '- Rimuovi tutti i tag HTML dai file markdown (`.md`)\n' +
                    '- Usa componenti Liquid o layout invece\n' +
                    '- Per script con variabili Liquid, mantienili inline in `.md`\n\n' +
                    'Per details, vedi il workflow log.'
            })

      - name: Check result
        if: always()
        run: |
          if [[ "${{ steps.check-html.outcome }}" == "success" ]]; then
            echo "✅ No HTML found in markdown files"
          else
            echo "❌ HTML found in markdown files"
            exit 1
          fi

  check-image-placeholders:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Check image placeholders
        id: check-placeholders
        run: |
          cd scripts
          node check-image-placeholders.js

      - name: Validate image specs
        id: validate-specs
        run: |
          cd scripts
          node validate-image-specs.js

      - name: Comment on PR if issues found
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Image Issues Found**\n\n' +
                    'Sostituisci placeholder o correggi specifiche:\n' +
                    '- **Volantini**: 3508×4961px (A3), max 500KB\n' +
                    '- **Featured**: 1200×630px (16:9), max 200KB\n\n' +
                    'Vedi log per dettagli completi.\n\n' +
                    '📖 Guida: docs/IMAGE_GUIDE.md'
            })

<!DOCTYPE HTML>
<html lang="it">
<head>
	{% seo %}
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1">

	{% if page.tags %}
		<meta name="keywords" content="{{ page.tags | join: ', ' }}">
	{% endif %}

	<!-- Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

	<!-- Font Awesome -->
	<link rel="stylesheet" href="/assets/css/font/font-awesome.min.css" />

	<!-- Scout Tech Modern CSS -->
	<link rel="stylesheet" href="/assets/css/scout-tech.css" />
	<link rel="stylesheet" href="/assets/css/scout-tech-mobile.css" />
</head>
<body>

	<!-- Navigation -->
	<nav class="navbar">
		<div class="navbar-content">
			<a href="/" class="navbar-brand">BitPrepared</a>
			<ul class="navbar-nav">
				<li><a href="/">Home</a></li>
				<li><a href="/about/">Chi siamo</a></li>
				<li><a href="/eventi/">Eventi</a></li>
				<li><a href="/software/">Software</a></li>
			</ul>
		</div>
	</nav>

	<!-- Main Content -->
	{{ content }}

	<!-- Footer -->
	<footer>
		<div class="footer-social">
			<a href="https://twitter.com/bitprepared" class="fa fa-twitter"><span>Twitter</span></a>
			<a href="https://www.facebook.com/bitprepared" class="fa fa-facebook"><span>Facebook</span></a>
			<a href="https://www.instagram.com/bit.prepared/" class="fa fa-instagram"><span>Instagram</span></a>
			<a href="mailto:info@bitprepared.it" class="fa fa-envelope"><span>Email</span></a>
		</div>
		<div class="footer-links">
			<a href="/about/">Chi siamo</a> |
			<a href="/eventi/">Eventi</a> |
			<a href="/software/">Software</a>
		</div>
		<div class="footer-copy">
			&copy; {{ site.time | date: "%Y" }} Bit Prepared - Associazione AGESCI<br>
			"Digito ergo sum" - Per un uso consapevole del digitale
		</div>
	</footer>

	<!-- Scroll Animations (Optional) -->
	<script src="/assets/js/scroll-animations.js"></script>

</body>
</html>

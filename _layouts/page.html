---
layout: default
---

{% unless page.no_hero %}
<!-- Hero Section -->
<header class="hero">
	<div class="hero-content">
		<h1 class="hero-title">{{ page.title }}</h1>
		{% if page.subtitle %}
		<p class="hero-subtitle">{{ page.subtitle }}</p>
		{% endif %}
	</div>
</header>
{% endunless %}

<!-- Page Content -->
<main class="page-section">
	<div class="container">
		<article class="page-content">
			{% include edit-button.html %}
			<div class="page-body">
				{{ content }}
			</div>
		</article>
	</div>
</main>

---
layout: default
---

<!-- Page Content -->
<main class="page-section">
	<div class="container">
		<article class="page-content">
			{% include edit-button.html %}
			<header class="page-header">
				<h1>{{ page.title }}</h1>
				{% if page.subtitle %}
				<p class="page-subtitle">{{ page.subtitle }}</p>
				{% endif %}
			</header>
			<div class="page-body">
				{{ content }}
			</div>
		</article>
	</div>
</main>

<style>
	.page-section {
		padding: var(--spacing-xl) var(--spacing-md);
		min-height: 60vh;
	}

	.page-content {
		max-width: 800px;
		margin: 0 auto;
	}

	.page-header {
		text-align: center;
		margin-bottom: var(--spacing-lg);
	}

	.page-header h1 {
		font-size: 2.5rem;
		color: var(--color-light);
		margin-bottom: var(--spacing-sm);
	}

	.page-subtitle {
		font-size: 1.25rem;
		color: var(--color-accent);
		font-family: var(--font-display);
	}

	.page-body {
		color: var(--color-light);
		line-height: 1.8;
		font-size: 1.1rem;
	}

	.page-body h2,
	.page-body h3,
	.page-body h4 {
		color: var(--color-accent);
		margin-top: var(--spacing-lg);
		margin-bottom: var(--spacing-sm);
	}

	.page-body p {
		margin-bottom: var(--spacing-sm);
	}

	.page-body a {
		color: var(--color-accent);
		text-decoration: underline;
	}

	.page-body ul,
	.page-body ol {
		margin-bottom: var(--spacing-sm);
		padding-left: var(--spacing-lg);
	}

	.page-body li {
		margin-bottom: var(--spacing-xs);
	}

	@media (max-width: 768px) {
		.page-header h1 {
			font-size: 2rem;
		}

		.page-subtitle {
			font-size: 1.1rem;
		}

		.page-body {
			font-size: 1rem;
		}
	}
</style>

---
layout: default
---

<!-- Hero Section -->
<header class="hero flex items-center justify-center text-center">
	<div class="hero-content max-w-5xl mx-auto px-6">
		<h1 class="hero-title text-5xl font-display font-bold text-light mb-4">{{ page.title }}</h1>
		{% if page.date %}
		<p class="hero-subtitle text-xl text-light">{{ page.date | date: "%d %B %Y" }}</p>
		{% endif %}
	</div>
</header>

<!-- Post Content -->
<main class="page-section px-6 py-16 min-h-[50vh]">
	<div class="max-w-4xl mx-auto">
		<article class="page-content">
			{% if page.featured %}
			<div class="post-featured-image mb-8 rounded-lg overflow-hidden border border-secondary">
				<img src="/assets/{{ page.featured }}" alt="" loading="lazy" class="w-full h-auto" role="presentation">
			</div>
			{% endif %}

			{% include edit-button.html %}

			<div class="page-body text-light leading-relaxed text-lg">
				{{ content }}
			</div>

			{% if page.tags %}
			<footer class="post-footer mt-16 pt-6 border-t border-secondary">
				<p class="post-tags text-center text-light">
					<strong>Tag:</strong>
					{% for tag in page.tags %}
					<a href="/tags/#{{ tag }}" class="btn btn-tag">#{{ tag }}</a>
					{% endfor %}
				</p>
			</footer>
			{% endif %}
		</article>
	</div>
</main>

title: Bit Prepared
description: Digito ergo sum, per un uso consapevole del digitale
tagline: maestro delle tecnologie, esperto del compiuter, digital life
paginate: 10
language: 'it'
lang: it_IT
locale: it_IT


url: https://www.bitprepared.it
email: info@bitprepared.it

twitter:
  username: bitprepared
  card: summary

# SEO plugin settings
seo:
  meta_generator: false

# output
encoding: "utf-8"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

gems:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  eventi:
    output: true
    permalink: /:collection/:name/
  software:
    output: true
    permalink: /:collection/:name/

exclude:
  - node_modules
  - vendor
  - .travis.yml
  - .github
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG.txt
  - LICENSE.txt
  - .git*
  - test-lookup.html
  - screenshots/
  - scripts/
  - .jekyll-cache/
  - .jekyll-metadata/

# Development configuration
project_path: /workspace/bitprepared.it

# SEO configuration
seo:
  title: Bit Prepared
  description: Bit Prepared eventi formativi ed educativi su tecnologia e societa
  author: Bit Prepared
  lang: it_IT
  locale: it_IT
  image: /assets/images/logo.png
  logo: /assets/images/logo.png
  social:
    name: Bit Prepared
    links:
      - https://twitter.com/bitprepared
      - https://www.facebook.com/bitprepared
      - https://www.instagram.com/bit.prepared/
  twitter:
    username: bitprepared
    card: summary_large_image

# Output directory (absolute path in container)
destination: /workspace/output/_site

# Cache directory (absolute path in container)
cache: /workspace/output/.jekyll-cache
